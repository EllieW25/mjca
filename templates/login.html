<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MJCA Login</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-card">

  <img
          src="{{ url_for('static', filename='images/MJCA_LOGO_TRANSPARENT.png') }}"
          width="180"
  >
    <h1>Please login to continue</h1>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >
<br><br>
        <input
            type="text"
            name="password"
            placeholder="Password"
            required
        >
<br><br>
        <button type="submit">
            Login
        </button>


    </form>

</div>
</body>
</html>
