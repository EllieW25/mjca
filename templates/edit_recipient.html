<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Recipient</title>

</head>
<body>
<form method="POST">

<label>Name:</label>
<input
    type="text"
    name="name"
    value="{{ recipient.name }}"
>

<br><br>

<label>Phone:</label>
<input
    type="text"
    name="phone"
    value="{{ recipient.phone }}"
>
<br><br>
<label>Type:</label>
<select name="recipient_type">
    <option value="Teacher"
    {% if recipient.recipient_type =="Teacher" %}
            selected
    {% endif %}>
        Teacher
    </option>

    <option value="Substitute"
    {% if recipient.recipient_type =="Substitute" %}
        selected
    {% endif %}>
        Substitute
    </option>
</select>

<br><br>

<label>Department:</label>
<input
     type="text"
     name="department"
     value="{{ recipient.department }}"
>
<br><br>

<label>
<input
    type="checkbox"
    name="active"
    {% if recipient.active %}
        checked
    {% endif %}
>
Active
</label>
<br><br>

<button type="submit">
Save Changes
</button>
</form>
</body>
</html>
